name: Build release APK

# Builds the unsigned release APK. The APK is signed afterwards, on the maintainer's own computer;
# the signing key never leaves it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Build the unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show checksums
        run: sha256sum build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: YS Calculator-unsigned-${{ github.ref_name }}
          path: build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publishes the build and creates a GitHub release. The APK is NOT attached here —
      # the maintainer signs the APK locally and uploads it to the release manually.
      # The signing key never leaves the maintainer's computer.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(awk -F'"' '/^[[:space:]]*versionName = / { print $2; exit }' build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from build.gradle.kts" >&2
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          TITLE="YS Calculator ${VERSION_NAME}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          BODY="Built from commit ${COMMIT_SHA}: ${COMMIT_SUBJECT}"
          if [ -n "$COMMIT_BODY" ]; then
            BODY="${BODY}"$'\n\n'"${COMMIT_BODY}"
          fi
          BODY="${BODY}"$'\n\n'"---"$'\n'"Unsigned APK available as a workflow artifact. Sign it locally and upload to this release."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its notes."
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "$TITLE" --notes "$BODY"
          fi
